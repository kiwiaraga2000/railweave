name: Build Saudi visa map

on:
  push:
    branches:
      - 'tmp/saudi-visa-map'
    paths:
      - '.github/workflows/build-saudi-visa-map.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download current Commons SVG
        shell: bash
        run: |
          curl -fL 'https://upload.wikimedia.org/wikipedia/commons/8/86/Visa_requirements_for_Saudi_citizens.svg' -o original.svg
          echo '89d36bb312d7c1c9687021cf101cb5531e3d5b63  original.svg' | sha1sum -c -

      - name: Update visa colours
        shell: python
        env:
          VISA_CSS_B64: ''
        run: |
          from pathlib import Path
          import base64
          import hashlib
          import os
          import xml.etree.ElementTree as ET

          original = Path('original.svg')
          text = original.read_text(encoding='utf-8')
          css = base64.b64decode(os.environ['VISA_CSS_B64']).decode('utf-8')
          marker = '</style>'
          if marker not in text:
              raise SystemExit('No </style> found')
          text = text.replace(marker, '\n' + css + '\n' + marker, 1)

          out = Path('Visa_requirements_for_Saudi_citizens_2026-08-10.svg')
          out.write_text(text, encoding='utf-8')
          ET.parse(out)

          assert 'width="2754"' in text and 'height="1398"' in text
          assert '.sa { fill: #002377; }' in text
          assert '.tw { opacity: 1; }' in text

          sha1 = hashlib.sha1(out.read_bytes()).hexdigest()
          Path('manifest.txt').write_text(
              f'original_sha1=89d36bb312d7c1c9687021cf101cb5531e3d5b63\n'
              f'updated_sha1={sha1}\n'
              f'updated_size={out.stat().st_size}\n',
              encoding='utf-8'
          )
          print(Path('manifest.txt').read_text())

      - name: Upload SVG artifact
        uses: actions/upload-artifact@v4
        with:
          name: saudi-visa-map-2026-08-10
          path: |
            Visa_requirements_for_Saudi_citizens_2026-08-10.svg
            manifest.txt
          if-no-files-found: error
