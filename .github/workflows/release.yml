name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: railweave-linux-x86_64
            binary: railweave
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: railweave-macos-aarch64
            binary: railweave
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: railweave-windows-x86_64
            binary: railweave.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo test --workspace --all-features
      - run: cargo build --release --target ${{ matrix.target }} -p railweave
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.asset }}
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/${{ matrix.asset }}/
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE dist/${{ matrix.asset }}/
      - name: Archive Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C dist -czf dist/${{ matrix.asset }}.tar.gz ${{ matrix.asset }}
      - name: Archive Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/${{ matrix.asset }}" -DestinationPath "dist/${{ matrix.asset }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
