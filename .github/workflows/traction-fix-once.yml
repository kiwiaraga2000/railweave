name: Traction Metadata Cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          vehicle = Path('crates/railweave-adapters/src/msts_vehicle.rs')
          text = vehicle.read_text()
          needle = '            "kw" => 1_000.0,\n            "hp" => 745.699_872,'
          replacement = '            "kw" => 1_000.0,\n            "mw" => 1_000_000.0,\n            "hp" => 745.699_872,'
          if needle not in text and '"mw" => 1_000_000.0' not in text:
              raise SystemExit('power unit patch target not found')
          vehicle.write_text(text.replace(needle, replacement))

          cli = Path('crates/railweave-cli/src/main.rs')
          text = cli.read_text()
          old = '''            "{verb} {} nodes, {} edges, {} assets, {} consists -> {}",
            result.project.network.nodes.len(),
            result.project.network.edges.len(),
            result.project.assets.len(),
            result.project.consists.len(),
            output.display()
'''
          new = '''            "{verb} {} nodes, {} edges, {} assets, {} vehicles, {} consists -> {}",
            result.project.network.nodes.len(),
            result.project.network.edges.len(),
            result.project.assets.len(),
            result.project.vehicles.len(),
            result.project.consists.len(),
            output.display()
'''
          if old not in text and '{} vehicles, {} consists' not in text:
              raise SystemExit('CLI summary patch target not found')
          cli.write_text(text.replace(old, new))
          PY
          cargo fmt --all
          git rm .github/workflows/traction-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish traction metadata support"
          git push
