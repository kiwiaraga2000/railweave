name: Settle Traction Metadata Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  settle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Wait for earlier one-shot jobs and settle main
        run: |
          sleep 90
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path

          vehicle = Path('crates/railweave-adapters/src/msts_vehicle.rs')
          text = vehicle.read_text()
          if '"mw" => 1_000_000.0' not in text:
              needle = '            "kw" => 1_000.0,\n            "hp" => 745.699_872,'
              if needle not in text:
                  raise SystemExit('power-unit patch target not found')
              text = text.replace(
                  needle,
                  '            "kw" => 1_000.0,\n            "mw" => 1_000_000.0,\n            "hp" => 745.699_872,',
              )
              vehicle.write_text(text)

          integration = Path('crates/railweave-compose/tests/msts_vehicle_compose.rs')
          if integration.exists():
              text = integration.read_text().replace(
                  'source = "stock"',
                  'source = "stock/TRAINS/CONSISTS/demo.con"',
              )
              integration.write_text(text)

          cli = Path('crates/railweave-cli/src/main.rs')
          text = cli.read_text()
          old = '''            "{verb} {} nodes, {} edges, {} assets, {} consists -> {}",
            result.project.network.nodes.len(),
            result.project.network.edges.len(),
            result.project.assets.len(),
            result.project.consists.len(),
            output.display()
'''
          new = '''            "{verb} {} nodes, {} edges, {} assets, {} vehicles, {} consists -> {}",
            result.project.network.nodes.len(),
            result.project.network.edges.len(),
            result.project.assets.len(),
            result.project.vehicles.len(),
            result.project.consists.len(),
            output.display()
'''
          if old in text:
              cli.write_text(text.replace(old, new))
          PY
          rm -f \
            .github/workflows/traction-fix-once.yml \
            .github/workflows/verify-traction-once.yml \
            .github/workflows/fix-traction-integration-once.yml \
            .github/workflows/settle-traction-once.yml
          cargo fmt --all
          cargo test --workspace
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Settle traction metadata support"
          git push origin HEAD:main
