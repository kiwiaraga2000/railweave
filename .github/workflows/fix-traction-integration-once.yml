name: Fix Traction Integration Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Fix, format and test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/railweave-compose/tests/msts_vehicle_compose.rs')
          text = p.read_text()
          text = text.replace(
              'source = "stock"',
              'source = "stock/TRAINS/CONSISTS/demo.con"',
          )
          p.write_text(text)
          PY
          cargo fmt --all
          cargo test --workspace
          git rm .github/workflows/fix-traction-integration-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix traction integration source"
          git push
